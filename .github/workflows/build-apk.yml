name: Build MotoHUD Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motohud-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm install

      - name: Build MotoHUD web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Add Android location permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          marker = '<manifest'
          start = text.find(marker)
          end = text.find('>', start)
          if start < 0 or end < 0:
              raise SystemExit("Could not locate the Android manifest root element")
          permissions = (
              '\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'
              '\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />'
          )
          if "android.permission.ACCESS_FINE_LOCATION" not in text:
              text = text[:end + 1] + permissions + text[end + 1:]
              manifest.write_text(text)
          PY

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: motohud-android-debug-keystore-v1

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoHUD-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
