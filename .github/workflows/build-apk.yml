name: Build MotoHUD Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motohud-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools were not found"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install web dependencies
        run: npm install

      - name: Build MotoHUD web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Add Android location permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          marker = '<manifest'
          start = text.find(marker)
          end = text.find('>', start)
          if start < 0 or end < 0:
              raise SystemExit("Could not locate the Android manifest root element")
          permissions = (
              '\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'
              '\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />'
          )
          if "android.permission.ACCESS_FINE_LOCATION" not in text:
              text = text[:end + 1] + permissions + text[end + 1:]
              manifest.write_text(text)
          PY

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Restore stable debug signing key
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: motohud-android-debug-keystore-v1

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: MotoHUD-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
