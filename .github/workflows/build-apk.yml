name: Build MotoHUD Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motohud-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools were not found"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install web dependencies
        run: npm install

      - name: Build MotoHUD web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Add native MotoHUD widget and GPS service
        shell: bash
        run: |
          cp -R native-android/app/src/main/java/. android/app/src/main/java/
          cp -R native-android/app/src/main/res/. android/app/src/main/res/

      - name: Add Android widget and location declarations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          permissions = [
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '    <uses-permission android:name="android.permission.CAMERA" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]
          for permission in permissions:
              name = permission.split('"')[1]
              if name not in text:
                  manifest = Path("android/app/src/main/AndroidManifest.xml")
                  marker = '<manifest'
                  root_start = text.find(marker)
                  root_end = text.find('>', root_start)
                  if root_start < 0 or root_end < 0:
                      raise SystemExit("Could not locate manifest root")
                  text = text[:root_end + 1] + '\n' + permission + text[root_end + 1:]

          application_marker = '<application'
          app_start = text.find(application_marker)
          app_end = text.find('>', app_start)
          if app_start < 0 or app_end < 0:
              raise SystemExit("Could not locate application element")

          declarations = '''
                  <service
                      android:name="com.granvia536.motohud.MotoHudLocationService"
                      android:exported="false"
                      android:foregroundServiceType="location" />
                  <receiver
                      android:name="com.granvia536.motohud.MotoHudWidgetProvider"
                      android:exported="true"
                      android:label="MotoHUD Widget">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_motohud_info" />
                  </receiver>
          '''
          if "MotoHudWidgetProvider" not in text:
              text = text[:app_end + 1] + declarations + text[app_end + 1:]

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          manifest_path.write_text(text, encoding="utf-8")
          PY

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Restore stable debug signing key
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: motohud-android-debug-keystore-v1

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: MotoHUD-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
